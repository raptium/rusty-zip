name: Security audit

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    # Re-check weekly so advisories published after the last commit are caught.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-audit
      # `--deny warnings` also fails on yanked and unsound crates, not only on
      # vulnerabilities: a yanked dependency is exactly what this job is
      # meant to catch.
      - name: Audit dependencies
        run: cargo audit --deny warnings
