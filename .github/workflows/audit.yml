name: Security audit

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    # Re-check weekly so advisories published after the last commit are caught.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-audit
      # `--deny warnings` also fails on yanked and unsound crates, not only on
      # vulnerabilities: a yanked dependency is exactly what this job is
      # meant to catch.
      - name: Audit dependencies
        run: cargo audit --deny warnings
