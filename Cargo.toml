[package]
name = "rusty-zip"
version = "0.1.0-alpha.2"
edition = "2021"
# Driven by pyo3 0.29 (1.83) and, more strictly, `time` >= 0.3.47 (1.88),
# which zip's default features pull in. Do not lower without checking both.
rust-version = "1.88"
description = "Python wrapper for Rust's zip crate with legacy ZipCrypto encryption support"
authors = ["Hao Guan <gh@raptium.net>"]
license = "MIT"
repository = "https://github.com/raptium/rusty-zip"
readme = "README.md"
keywords = ["python", "zip", "compression", "zipcrypto", "pyo3"]
categories = ["compression", "api-bindings"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rusty_zip"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
pyo3-file = "0.17.0"
# Pinned exactly because ZipCrypto writing uses the `unstable` API.
# Must stay >= 2.3.0: that fixes CVE-2025-29787 / RUSTSEC-2025-0168, and
# 2.1.3-2.2.3 were yanked because of it.
zip = { version = "=2.4.2" }
