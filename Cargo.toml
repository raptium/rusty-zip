[package]
name = "rusty-zip"
version = "0.1.0-alpha.2"
edition = "2021"
# Driven by pyo3 0.29 (1.83) and, more strictly, `time` >= 0.3.47 (1.88),
# which zip's default features pull in. Do not lower without checking both.
rust-version = "1.88"
description = "Python wrapper for Rust's zip crate with legacy ZipCrypto encryption support"
authors = ["Hao Guan <gh@raptium.net>"]
license = "MIT"
repository = "https://github.com/raptium/rusty-zip"
readme = "README.md"
keywords = ["python", "zip", "compression", "zipcrypto", "pyo3"]
categories = ["compression", "api-bindings"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rusty_zip"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
pyo3-file = "0.17.0"
# Pinned exactly because ZipCrypto writing uses zip's `unstable` API, whose own
# docs require an exact version specifier.
# `default-features = false` because this crate only ever writes Deflated +
# ZipCrypto: the default feature set also pulls in AES, bzip2, zstd, lzma and
# ppmd (several of them C libraries), and `aes` would raise the MSRV to 1.89.
# `time` must stay enabled, otherwise entries are dated 1980-01-01.
zip = { version = "=8.6.0", default-features = false, features = ["deflate", "time"] }
